<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Crea tu perfil profesional en Hire-U.">
  <title>Crear perfil | Hire-U</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="profile-page">
  <header class="site-header">
    <div class="header-inner profile-header">
      <a class="brand" href="./index.html" aria-label="Hire-U, inicio">
        <img class="header-logo" src="assets/logo-hire-u.png" alt="Hire-U">
      </a>
      <a class="button button-ghost" href="./index.html">Volver al inicio</a>
    </div>
  </header>

  <main class="profile-content">
    <p class="eyebrow dark">Únete a Hire-U</p>
    <h1>Crea tu perfil profesional</h1>
    <p class="profile-intro">Completa tus datos para conectar con oportunidades para estudiantes y egresados.</p>

    <form class="profile-form" id="profileForm">
      <label class="profile-field" for="firstName">Nombres
        <input id="firstName" name="firstName" type="text" autocomplete="given-name" maxlength="100" required>
      </label>
      <label class="profile-field" for="lastName">Apellidos
        <input id="lastName" name="lastName" type="text" autocomplete="family-name" maxlength="100" required>
      </label>
      <label class="profile-field profile-field-wide" for="email">Correo institucional
        <input id="email" name="email" type="email" autocomplete="email" maxlength="150" required>
      </label>
      <label class="profile-field" for="institution">Institución educativa
        <input id="institution" name="institution" type="text" autocomplete="organization" maxlength="150">
      </label>
      <label class="profile-field" for="academicLevel">Nivel académico
        <select id="academicLevel" name="academicLevel">
          <option value="">Seleccionar</option>
          <option>Técnico</option>
          <option>Tecnológico</option>
          <option>Universitario</option>
          <option>Posgrado</option>
        </select>
      </label>
      <label class="profile-field" for="career">Carrera o área de formación
        <input id="career" name="career" type="text" maxlength="100">
      </label>
      <label class="profile-field" for="graduationYear">Año de grado
        <input id="graduationYear" name="graduationYear" type="number" min="1950" max="2036" inputmode="numeric">
      </label>
      <label class="profile-field profile-field-wide" for="professionalProfile">Perfil profesional
        <textarea id="professionalProfile" name="professionalProfile" rows="4" maxlength="2000"></textarea>
      </label>
      <label class="profile-field" for="password">Contraseña (mínimo 8 caracteres)
        <input id="password" name="password" type="password" autocomplete="new-password" minlength="8" maxlength="72" required>
      </label>
      <label class="profile-field profile-field-wide" for="confirmPassword">Confirmar contraseña
        <input id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password" minlength="8" maxlength="72" required>
      </label>
      <p class="form-message profile-message" id="profileMessage" role="status" aria-live="polite"></p>
      <button class="button button-primary profile-submit" type="submit">Crear perfil</button>
    </form>
    <p class="profile-login">¿Ya tienes una cuenta? <a href="./index.html#inicio">Inicia sesión</a></p>
  </main>
  <script type="module" src="profile.js"></script>
</body>
</html>
